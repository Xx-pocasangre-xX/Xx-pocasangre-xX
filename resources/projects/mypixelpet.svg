@keyframes pulso{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.c,.b{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
<g class="c">
<rect width="490" height="262" rx="16" fill="url(#bg)"/>
<rect x=".5" y=".5" width="489" height="261" rx="16" fill="none" stroke="#818cf8" stroke-opacity=".35"/>
<rect class="b" x="0" y="0" width="6" height="262" rx="3" fill="url(#ac)"/>
<rect x="28" y="20" width="177" height="24" rx="12" fill="#22d3ee" fill-opacity=".14"/>
<text x="39" y="36" font-family="Consolas, Menlo, monospace" font-size="12" fill="#22d3ee">PROYECTO PROPIO · C++</text>
