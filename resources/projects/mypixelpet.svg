<svg xmlns="http://www.w3.org/2000/svg" width="490" height="262" viewBox="0 0 490 262" role="img" aria-labelledby="t d">
<title id="t">MyPixelPet</title><desc id="d">Simulador de mascota virtual en consola: 4 especies, estadísticas, 5 partidas guardadas y tiempos de espera.</desc>
<style>
.c{animation:ent .8s cubic-bezier(.2,.7,.2,1) both}
.b{animation:pulso 3.5s ease-in-out infinite}
