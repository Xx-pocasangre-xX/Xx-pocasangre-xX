<text x="28" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">Simulador de mascota virtual en consola: 4 especies,</text>
<text x="28" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">estadísticas, 5 partidas guardadas y tiempos de espera.</text>
<rect x="28" y="156" width="39" height="22" rx="11" fill="#ffffff" fill-opacity=".08"/>
<text x="37" y="171" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">C++</text>
<rect x="75" y="156" width="193" height="22" rx="11" fill="#ffffff" fill-opacity=".08"/>
