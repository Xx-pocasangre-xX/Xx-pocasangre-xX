name: Actualizar calendario de actividad

# Genera resources/activity.svg con los datos de contribuciones de la API de GitHub.
# Corre a diario (en la rama principal), a mano, y cuando cambia el script o este flujo.
on:
  schedule:
    # 7:00 y 19:00 en El Salvador (UTC-6, sin horario de verano) = 13:00 y 01:00 UTC
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build-activity.mjs
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar el calendario
        run: node scripts/build-activity.mjs --user Xx-pocasangre-xX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/activity.svg
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualiza el calendario de actividad"
            git push
          fi
